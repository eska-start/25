name: Extract ZIP project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP='miniature-junk-racing-game (1).zip'
          mkdir -p _extract
          unzip -o "$ZIP" -d _extract
          find _extract -mindepth 1 -maxdepth 1 -type d -exec sh -c 'cp -a "$1"/. ./' _ {} \;
          find _extract -mindepth 1 -maxdepth 1 ! -type d -exec cp -f {} . \;
          rm -rf _extract
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract miniature junk racing game ZIP" || echo "No changes to commit"
          git push
